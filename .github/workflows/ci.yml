name: CI

# Só push: com pull_request também, cada push num branch com PR aberta rodava duas vezes e gastava os minutos do Actions em dobro.
# O resultado do push aparece na PR, porque é o mesmo commit.
on:
  push:

# Um push novo no mesmo branch cancela a execução anterior, que já não vale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # as execuções verdes levavam até cerca de 12 min
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # o guarda do piso e a cobertura do código novo comparam com origin/main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # CONSTRAINTS.md: todas bloqueiam (os avisos venceram em 2026-11-06; ligados na T13).
      - run: npm run check:floor
      # Versões fixas (T13): @latest mudaria o veredito sem mudança no repositório.
      - name: Instalar gitleaks e osv-scanner
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.2.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Segredos (gitleaks)
        run: npm run check:secrets
      - run: npx vitest run --coverage
      - name: Cobertura do código novo
        run: node scripts/coverage-changed.mjs --base origin/main
      - run: npm audit --audit-level=high
      - name: Segurança do código (semgrep)
        run: |
          pipx install semgrep==1.182.1
          semgrep scan --config p/default --config p/owasp-top-ten --severity ERROR --error src
      - name: Segurança das dependências (osv-scanner, Alto ou acima)
        run: node scripts/osv-gate.mjs
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - run: npx playwright install --with-deps chromium
      # T3: o app exige login; o E2E cria e apaga um usuário fictício com a chave de serviço.
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # T2: isolamento entre empresas contra o Supabase de teste. A migração é aplicada fora do CI
  # (npm run db:migrate, com o token de acesso, que não entra aqui); este job prova o estado do banco.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:db
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
